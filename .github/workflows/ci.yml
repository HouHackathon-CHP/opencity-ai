# SPDX-License-Identifier: Apache-2.0
name: OpenCity AI CI/CD

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: License Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors sentencepiece protobuf av

      - name: Verify Open Source Licenses
        run: python scripts/check_direct_licenses.py

      - name: Run Unit Tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opencity-ai:latest
