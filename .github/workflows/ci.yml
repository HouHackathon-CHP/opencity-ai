# SPDX-License-Identifier: Apache-2.0
name: OpenCity AI CI/CD

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or tag to deploy on server"
        required: false
        default: "main"

jobs:
  test:
    name: License Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors sentencepiece protobuf av

      - name: Verify Open Source Licenses
        run: python scripts/check_direct_licenses.py

      - name: Run Unit Tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opencity-ai:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.repository_owner == 'HouHackathon-CHP' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy opencity-ai over SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.OPENCITY_AI }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST || '118.70.222.137' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '2222' }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'chp' }}
          TARGET_REF: ${{ inputs.target_ref || github.ref_name || 'main' }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY secret is empty or not granted access to this repository."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "~/opencity/redeploy.sh ai ${TARGET_REF}"
