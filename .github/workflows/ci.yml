# SPDX-License-Identifier: Apache-2.0
name: OpenCity AI CI/CD

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or tag to deploy on server"
        required: false
        default: "main"

jobs:
  test:
    name: License Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors sentencepiece protobuf av

      - name: Verify Open Source Licenses
        run: python scripts/check_direct_licenses.py

      - name: Run Unit Tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opencity-ai:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.repository_owner == 'HouHackathon-CHP' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy opencity-ai over SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.OPENCITY_AI }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST || '118.70.222.137' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '2222' }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'chp' }}
          TARGET_REF: ${{ inputs.target_ref || github.ref_name || 'main' }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY secret is empty or not granted access to this repository."
            exit 1
          fi
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64, os, pathlib, re, textwrap
          raw = os.environ["SERVER_SSH_KEY"].replace("\x00", "").lstrip("\ufeff").replace("\r\n", "\n").replace("\r", "\n").strip()
          if "BEGIN " not in raw and "\n" not in raw and len(raw) > 100:
              try:
                  dec = base64.b64decode(raw, validate=True).decode("utf-8", errors="ignore").replace("\r", "").strip()
                  if "BEGIN " in dec:
                      raw = dec
              except Exception:
                  pass
          block = re.search(r"(-----BEGIN [A-Z0-9 ]+-----.*?-----END [A-Z0-9 ]+-----)", raw, flags=re.S)
          if block:
              raw = block.group(1)
          m = re.fullmatch(r"(-----BEGIN [A-Z0-9 ]+-----)\s+(.+?)\s+(-----END [A-Z0-9 ]+-----)", raw, flags=re.S)
          if m and "\n" not in m.group(2):
              parts = m.group(2).split()
              body = "\n".join(parts) if len(parts) > 1 else "\n".join(textwrap.wrap(parts[0], 70))
              raw = f"{m.group(1)}\n{body}\n{m.group(3)}"
          raw = "\n".join(line.strip() for line in raw.splitlines() if line.strip()) + "\n"
          p = pathlib.Path(os.path.expanduser("~/.ssh/deploy_key"))
          p.write_text(raw, encoding="utf-8")
          p.chmod(0o600)
          PY
          if ! err=$(ssh-keygen -y -P "" -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            lines=$(wc -l < ~/.ssh/deploy_key)
            bytes=$(wc -c < ~/.ssh/deploy_key)
            max_line=$(awk '{if (length>m) m=length} END{print m+0}' ~/.ssh/deploy_key)
            has_begin=$(grep -c '^-----BEGIN ' ~/.ssh/deploy_key || true)
            has_end=$(grep -c '^-----END ' ~/.ssh/deploy_key || true)
            is_pub=$(grep -cE '^(ssh-|ecdsa-)' ~/.ssh/deploy_key || true)
            err_clean=$(printf '%s' "$err" | tr '\n' ' ')
            echo "::error::Invalid OpenSSH private key (${err_clean}): lines=${lines}, bytes=${bytes}, max_line=${max_line}, begin=${has_begin}, end=${has_end}, pub=${is_pub}"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "~/opencity/redeploy.sh ai ${TARGET_REF}" 2>&1 || {
              echo "::error::SSH deploy to ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT} failed (see SSH output above)."
              exit 1
            }
